# CronJob di guazza — ingestion e pipeline.
# DuckDB è single-writer: concurrencyPolicy Forbid evita run sovrapposte.
# Volume PVC guazza-data montato intero su /var/lib/guazza (job = unico scrittore).
apiVersion: batch/v1
kind: CronJob
metadata:
  name: guazza-realtime
  namespace: guazza
spec:
  schedule: "2,17,32,47 * * * *"
  timeZone: Europe/Rome
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: guazza-ingest
              image: ghcr.io/iltruma/guazza:v0.13.0
              imagePullPolicy: IfNotPresent
              command: ["guazza-ingest", "realtime"]
              env:
                - name: TZ
                  value: Europe/Rome
                - name: DB_PATH
                  value: /var/lib/guazza/guazza.duckdb
                - name: MODEL_DIR
                  value: /var/lib/guazza/models
                - name: OUTPUT_DIR
                  value: /var/lib/guazza/output
              envFrom:
                - secretRef:
                    name: netatmo-credentials
                - secretRef:
                    name: kuma-push-url
              volumeMounts:
                - name: data
                  mountPath: /var/lib/guazza
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
          volumes:
            - name: data
              persistentVolumeClaim:
                claimName: guazza-data
---
