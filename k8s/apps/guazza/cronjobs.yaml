apiVersion: batch/v1
kind: CronJob
metadata:
  name: guazza-historical
  namespace: guazza
spec:
  # Backfill manuale — kubectl create job --from=cronjob/guazza-historical ...
  schedule: "0 0 1 1 *"
  suspend: true
  timeZone: Europe/Rome
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      ttlSecondsAfterFinished: 86400
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: guazza-historical
              image: ghcr.io/iltruma/guazza:v0.13.0
              imagePullPolicy: IfNotPresent
              command: ["guazza-ingest", "historical"]
              env:
                - name: TZ
                  value: Europe/Rome
                - name: DB_PATH
                  value: /var/lib/guazza/guazza.duckdb
                - name: MODEL_DIR
                  value: /var/lib/guazza/models
                - name: OUTPUT_DIR
                  value: /var/lib/guazza/output
              envFrom:
                - secretRef:
                    name: netatmo-credentials
                - secretRef:
                    name: kuma-push-url
              volumeMounts:
                - name: data
                  mountPath: /var/lib/guazza
          volumes:
            - name: data
              persistentVolumeClaim:
                claimName: guazza-data
