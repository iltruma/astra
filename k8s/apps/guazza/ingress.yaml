apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: guazza
  namespace: guazza
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - guazza.lab.paroparo.it
      # Secret name not set: Traefik uses the default wildcard secret
      # (wildcard-lab-paroparo-it-tls) from kube-system for *.lab.paroparo.it.
  rules:
    - host: guazza.lab.paroparo.it
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: guazza-web
                port:
                  number: 8080
